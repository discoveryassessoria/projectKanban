<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torre de Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar fixa à esquerda, pulso + caixa de decisões no topo, abas de trabalho abaixo. Desktop-first (1280+), empilha em telas estreitas. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f7f9fc; --line:#dfe4ee; --line-soft:#edf0f5;
  --fg:#141a2b; --muted:#5b6478; --muted-2:#7a8296;
  --navy:#0b1f4b; --navy-2:#1d3466; --accent:#c9622b; --accent-soft:#fff6f0; --accent-line:#f0c9b3;
  --red:#8f1d17; --red-bg:#fbe7e6; --amb:#7a4a00; --amb-bg:#fff1d6; --grn:#155e39; --grn-bg:#e1f3e8; --blu:#1d3f8f; --blu-bg:#e3ebfa; --gry:#4c5568; --gry-bg:#eceff4; --pur:#5b2a8a; --pur-bg:#f1e8fb;
  --font:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1524; --surface:#171f33; --surface-2:#1d2740; --line:#2b3550; --line-soft:#232d47;
  --fg:#e7ebf5; --muted:#a3acc2; --muted-2:#7f8aa6; --navy:#0b1f4b; --navy-2:#1d3466; --accent:#e07a43; --accent-soft:#2a1e18; --accent-line:#5a3a28;
  --red:#ff9b94; --red-bg:#3a1a18; --amb:#ffcf7a; --amb-bg:#3a2a10; --grn:#8fe0b0; --grn-bg:#153125; --blu:#9fb8ff; --blu-bg:#1b2747; --gry:#c3cadb; --gry-bg:#2a3247; --pur:#d6b8f5; --pur-bg:#2c1f3d; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1524; --surface:#171f33; --surface-2:#1d2740; --line:#2b3550; --line-soft:#232d47;
  --fg:#e7ebf5; --muted:#a3acc2; --muted-2:#7f8aa6; --navy:#0b1f4b; --navy-2:#1d3466; --accent:#e07a43; --accent-soft:#2a1e18; --accent-line:#5a3a28;
  --red:#ff9b94; --red-bg:#3a1a18; --amb:#ffcf7a; --amb-bg:#3a2a10; --grn:#8fe0b0; --grn-bg:#153125; --blu:#9fb8ff; --blu-bg:#1b2747; --gry:#c3cadb; --gry-bg:#2a3247; --pur:#d6b8f5; --pur-bg:#2c1f3d; color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:36px}
#app{display:flex;min-height:100%}
.side{width:200px;flex-shrink:0;background:var(--navy);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;color:#c9d2e6;text-decoration:none;font-size:14px;font-weight:500}
.side a.on{background:var(--navy-2);color:#fff}
main{flex-grow:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:700;color:var(--fg)}
.sub{font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;text-align:left;min-height:44px}
.kpi.on{border-color:var(--accent);background:var(--accent-soft)}
.kpi b{font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kpi i{font-style:normal;font-size:11px;color:var(--muted-2)}
.kpi .up{color:var(--red)}.kpi .down{color:var(--grn)}
.tabs{display:flex;gap:2px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:12px 12px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;display:flex;gap:8px;align-items:center;min-height:44px}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{background:var(--gry-bg);color:var(--fg);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.tab.on .n{background:var(--accent);color:#fff}
.tab .n.warn{background:var(--amb-bg);color:var(--amb)}
.tab .n.red{background:var(--red-bg);color:var(--red)}
section.body{padding:18px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-red{background:var(--red-bg);color:var(--red)}.p-amb{background:var(--amb-bg);color:var(--amb)}.p-grn{background:var(--grn-bg);color:var(--grn)}.p-blu{background:var(--blu-bg);color:var(--blu)}.p-gry{background:var(--gry-bg);color:var(--gry)}.p-ex{background:var(--pur-bg);color:var(--pur);border:1px dashed var(--pur)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;min-height:36px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.sm{padding:4px 9px;min-height:30px;font-size:12px}
.btn:focus-visible,.tab:focus-visible,.kpi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line-soft);font-size:13px;min-height:44px}
.row:hover{background:var(--surface-2)}.row.sel{background:var(--accent-soft)}
.hd{display:grid;gap:10px;padding:8px 14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);font-weight:600}
.scroll{overflow-x:auto}
.gT{grid-template-columns:26px 1.6fr 1fr .9fr 1fr .9fr .8fr .8fr 150px;min-width:1100px}
.gA{grid-template-columns:110px 1.8fr 1.2fr 220px;min-width:900px}
.gE{grid-template-columns:1.2fr 1fr 80px 80px 80px 90px 180px;min-width:900px}
.gP{grid-template-columns:1.4fr .9fr 1fr .8fr .8fr .9fr 1fr 140px;min-width:1100px}
.gC{grid-template-columns:1.4fr .7fr .8fr .8fr .8fr .8fr 190px;min-width:1000px}
.gL{grid-template-columns:130px 1fr 1.6fr 1fr;min-width:800px}
.grp{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface-2);border-top:1px solid var(--line);font-size:13px}
.chk{width:18px;height:18px;border:2px solid var(--muted-2);border-radius:4px;display:inline-block;background:var(--surface);padding:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.bar{height:8px;background:var(--gry-bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.red{background:var(--red)}.bar i.grn{background:var(--grn)}
.heat{display:grid;gap:4px;font-size:12px}
.cell{border-radius:6px;padding:8px 6px;text-align:center;min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:2px;border:1px solid var(--line)}
.h0{background:var(--surface-2);color:var(--muted-2)}.h1{background:var(--grn-bg);color:var(--grn)}.h2{background:var(--amb-bg);color:var(--amb)}.h3{background:var(--red-bg);color:var(--red);font-weight:700}
.hx{background:var(--surface);color:var(--fg);border-color:var(--navy)}
.mono{font-family:var(--mono);font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;display:flex;gap:12px;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.overlay{position:fixed;inset:0;background:rgba(11,31,75,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(760px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .top{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .cnt{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ex{font-size:11px;color:var(--pur);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.brief{border-left:4px solid var(--accent);padding:12px 16px;font-size:14px;line-height:1.55}
.brief b{color:var(--fg)}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.step.cur{border-color:var(--accent);background:var(--accent-soft)}.step.done{background:var(--grn-bg)}
.small{font-size:12px;color:var(--muted)}
h2{margin:0;font-size:15px;font-weight:700}
@media (max-width:900px){ .side{display:none} header,.kpis,.tabs,section.body{padding-left:16px;padding-right:16px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div id="app"></div>
<script type="text/template" id="tpl">
<nav class="side">
  <div style="color:#fff;font-weight:700;font-size:16px;padding:6px 12px 18px">Grupo Discovery</div>
  <a href="#">Página Inicial</a><a href="#">Processos</a><a href="#">Operação</a><a href="#" class="on">Torre de Controle</a><a href="#">Calendário</a><a href="#">Árvore Genealógica</a><a href="#">Relatórios</a><a href="#">Gerenciamento</a>
  <div style="flex-grow:1"></div>
  <div style="color:#8fa0c8;font-size:11px;padding:8px 12px">Acesso: Administrador · gerência operacional</div>
</nav>
<main>
  <header>
    <div style="display:flex;flex-direction:column;gap:2px">
      <h1>Torre de Controle</h1>
      <div class="sub">Segunda, 28 de setembro · Marco Rovatti · Administrador · <span class="mono">fonte: projeção da Operação</span></div>
    </div>
    <div style="flex-grow:1"></div>
    <select id="nac" aria-label="Nacionalidade" value="{{ nac }}" onChange="{{ setNac }}" style="width:auto"><option value="todas">Todas as nacionalidades</option><option value="Espanha">🇪🇸 Espanha</option><option value="Itália">🇮🇹 Itália</option><option value="Alemanha">🇩🇪 Alemanha</option><option value="Portugal">🇵🇹 Portugal</option></select>
    <input id="busca" aria-label="Buscar" placeholder="Buscar família, pessoa, cartório, tarefa…" value="{{ busca }}" onChange="{{ setBusca }}" style="min-width:260px">
    <button class="btn" onClick="{{ openBrief }}">☀ Briefing do dia</button>
    <button class="btn" onClick="{{ openRevisao }}">▶ Revisar o dia ({{ nAtt }})</button>
    <sc-if value="{{ hasUndo }}" hint-placeholder-val="{{ false }}"><button class="btn sm" onClick="{{ doUndo }}">↶ Desfazer: {{ undoLabel }}</button></sc-if>
  </header>

  <div class="kpis">
    <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="8">
      <button class="kpi {{ k.on }}" onClick="{{ k.go }}"><b style="color:{{ k.color }}">{{ k.n }}</b><span>{{ k.label }}</span><i class="{{ k.trendCls }}">{{ k.trend }}</i></button>
    </sc-for>
  </div>

  <div class="tabs">
    <button class="tab {{ onAtt }}" onClick="{{ goAtt }}">Precisa de você <span class="n red">{{ nAtt }}</span></button>
    <button class="tab {{ onRadar }}" onClick="{{ goRadar }}">Radar</button>
    <button class="tab {{ onTar }}" onClick="{{ goTar }}">Tarefas <span class="n">{{ nTar }}</span></button>
    <button class="tab {{ onEq }}" onClick="{{ goEq }}">Equipe <span class="n">3</span></button>
    <button class="tab {{ onProc }}" onClick="{{ goProc }}">Processos <span class="n">{{ nProc }}</span></button>
    <button class="tab {{ onTer }}" onClick="{{ goTer }}">Terceiros <span class="n warn">{{ nCobVenc }} a cobrar</span></button>
    <button class="tab {{ onReg }}" onClick="{{ goReg }}">Regras</button>
    <button class="tab {{ onInt }}" onClick="{{ goInt }}">Integridade <span class="n {{ intCls }}">{{ nInt }}</span></button>
    <button class="tab {{ onAud }}" onClick="{{ goAud }}">Auditoria</button>
    <div style="flex-grow:1"></div>
    <sc-if value="{{ hasKpi }}" hint-placeholder-val="{{ false }}"><span class="pill p-red">Filtro: {{ kpiLabel }} <button class="btn sm" onClick="{{ clearKpi }}" style="border:0;background:transparent;min-height:20px;padding:0 4px">✕</button></span></sc-if>
  </div>

  <section class="body">

    <!-- ===== PRECISA DE VOCÊ ===== -->
    <sc-if value="{{ tabAtt }}" hint-placeholder-val="{{ true }}">
      <div class="small">Decisões que só o Administrador toma. Cada linha tem a ação embutida. O score ordena: maior risco primeiro.</div>
      <sc-if value="{{ emptyAtt }}" hint-placeholder-val="{{ false }}"><div class="card" style="padding:40px;text-align:center"><b style="font-size:16px;color:var(--grn)">Nada depende de você agora.</b></div></sc-if>
      <div class="card scroll">
        <div class="hd gA"><span>Tipo</span><span>O que está acontecendo</span><span>Sugestão do sistema</span><span>Ação</span></div>
        <sc-for list="{{ att }}" as="a" hint-placeholder-count="6">
          <div class="row gA">
            <span class="pill {{ a.cls }}">{{ a.tipo }}</span>
            <div><b>{{ a.titulo }}</b><div class="small">{{ a.det }}</div></div>
            <div class="small">{{ a.sug }}</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn acc sm" onClick="{{ a.go1 }}">{{ a.b1 }}</button><button class="btn sm" onClick="{{ a.go2 }}">{{ a.b2 }}</button></div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <!-- ===== RADAR ===== -->
    <sc-if value="{{ tabRadar }}" hint-placeholder-val="{{ false }}">
      <div class="small">Família × fase. A célula da fase atual mostra de quem é a bola e há quantos dias. Cor = risco (atraso nosso, cobrança vencida, sem dono). Clique numa família para abrir o foco.</div>
      <div class="card" style="padding:14px">
        <div class="heat" style="grid-template-columns:180px repeat(9,1fr)">
          <div></div>
          <sc-for list="{{ fases }}" as="f" hint-placeholder-count="9"><div class="small" style="text-align:center;font-weight:600">{{ f }}</div></sc-for>
          <sc-for list="{{ radar }}" as="r" hint-placeholder-count="5">
            <button onClick="{{ r.go }}" style="text-align:left;border:0;background:transparent;font-family:inherit;padding:6px 4px;min-height:44px"><b>{{ r.fam }}</b><div class="small">{{ r.pais }} · {{ r.ex }}</div></button>
            <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="9"><div class="cell {{ c.cls }}"><span>{{ c.txt }}</span><span class="small" style="color:inherit">{{ c.sub }}</span></div></sc-for>
          </sc-for>
        </div>
        <div style="display:flex;gap:14px;margin-top:12px;flex-wrap:wrap" class="small"><span class="pill h1">no ritmo</span><span class="pill h2">atenção: cobrança vencida ou parado 7+ dias</span><span class="pill h3">crítico: atraso nosso, sem dono ou fase sem passos</span><span class="pill hx">fase atual</span></div>
      </div>
    </sc-if>

    <!-- ===== TAREFAS ===== -->
    <sc-if value="{{ tabTar }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <label class="field" style="flex-direction:row;align-items:center;gap:6px"><span>Agrupar por</span><select id="grp" aria-label="Agrupar por" value="{{ group }}" onChange="{{ setGroup }}" style="width:auto"><option value="fam">Família</option><option value="resp">Responsável</option><option value="org">Cartório</option><option value="fase">Fase</option><option value="none">Sem agrupamento</option></select></label>
        <label class="field" style="flex-direction:row;align-items:center;gap:6px"><span>Visão</span><select id="vista" aria-label="Visão salva" value="{{ vista }}" onChange="{{ setVista }}" style="width:auto"><option value="todas">Todas as abertas</option><option value="vencidas">Vencidas</option><option value="semdono">Sem responsável</option><option value="aguard">Com o cartório</option><option value="minha">Minha visão · Espanha atrasadas</option></select></label>
        <button class="btn sm" onClick="{{ saveVista }}">Salvar visão</button>
        <div style="flex-grow:1"></div>
        <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:6px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:10px;padding:5px 8px;flex-wrap:wrap">
            <span style="font-size:13px;font-weight:600">{{ selCount }} sel.</span>
            <button class="btn acc sm" onClick="{{ atribuirSel }}">Atribuir a Gabriel</button>
            <button class="btn sm" onClick="{{ prioSel }}">Prioridade alta</button>
            <button class="btn sm" onClick="{{ repactSel }}">Repactuar prazo</button>
            <button class="btn sm" onClick="{{ cobrarSel }}">Cobrar cartório</button>
            <button class="btn sm" onClick="{{ clearSel }}">Limpar</button>
          </div>
        </sc-if>
      </div>
      <sc-for list="{{ grupos }}" as="G" hint-placeholder-count="2">
        <div class="card scroll" style="border-left:4px solid var(--navy)">
          <div class="grp" style="border-top:0;border-radius:12px 12px 0 0"><button class="chk {{ G.chkCls }}" onClick="{{ G.toggleAll }}" aria-label="Selecionar grupo"></button><b>{{ G.nome }}</b><span class="small">{{ G.sub }}</span><div style="flex-grow:1"></div><span class="pill p-gry">{{ G.n }} tarefas</span></div>
          <div class="hd gT"><span></span><span>Certidão · pessoa</span><span>Bola com</span><span>Etapa</span><span>Responsável</span><span>Prazo</span><span>Acomp.</span><span>Risco</span><span></span></div>
          <sc-for list="{{ G.items }}" as="t" hint-placeholder-count="4">
            <div class="row gT {{ t.selCls }}">
              <button class="chk {{ t.chkCls }}" onClick="{{ t.toggle }}" aria-label="Selecionar"></button>
              <div><b>{{ t.doc }}</b><div class="small">{{ t.pessoa }} · {{ t.fam }} · <span class="mono">#{{ t.id }}</span></div></div>
              <div><span class="pill {{ t.bolaCls }}">{{ t.bola }}</span><div class="small">{{ t.bolaDias }}</div></div>
              <div class="small">{{ t.etapa }}</div>
              <div><span class="{{ t.respCls }}">{{ t.resp }}</span></div>
              <div><span class="{{ t.prazoCls }}">{{ t.prazo }}</span><div class="small">{{ t.prazoSub }}</div></div>
              <div class="small">{{ t.acomp }}</div>
              <div><span class="pill {{ t.riscoCls }}">{{ t.risco }}</span></div>
              <div style="display:flex;gap:4px"><button class="btn sm pri" onClick="{{ t.open }}">Abrir</button><button class="btn sm" onClick="{{ t.quick }}">{{ t.quickLabel }}</button></div>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </sc-if>

    <!-- ===== EQUIPE ===== -->
    <sc-if value="{{ tabEq }}" hint-placeholder-val="{{ false }}">
      <div class="small">Capacidade medida = quanto a pessoa fecha por semana. Fila em semanas = ativas ÷ capacidade. Limite e aptidões vêm do cadastro Capacidade Operacional (hoje vazios).</div>
      <div class="card scroll">
        <div class="hd gE"><span>Pessoa</span><span>Carga</span><span>Ativas</span><span>Atrasadas</span><span>Aguard.</span><span>Fila</span><span>Ações</span></div>
        <sc-for list="{{ team }}" as="p" hint-placeholder-count="3">
          <div class="row gE">
            <div><b>{{ p.nome }}</b><div class="small">{{ p.papel }} · aptidões: {{ p.apt }} · {{ p.aus }}</div></div>
            <div><div class="bar"><i class="{{ p.barCls }}" style="width:{{ p.pct }}%"></i></div><div class="small">{{ p.ativas }} de {{ p.limite }} · fecha {{ p.cap }}/sem</div></div>
            <div><b>{{ p.ativas }}</b></div><div><b style="color:{{ p.atrColor }}">{{ p.atr }}</b></div><div>{{ p.aguard }}</div><div><span class="pill {{ p.filaCls }}">{{ p.fila }}</span></div>
            <div style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn sm" onClick="{{ p.ausencia }}">{{ p.ausLabel }}</button><button class="btn sm" onClick="{{ p.sucessao }}">Mover carteira</button><button class="btn sm" onClick="{{ p.simular }}">Simular saída</button></div>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{ hasSim }}" hint-placeholder-val="{{ false }}">
        <div class="card" style="padding:14px;border-left:4px solid var(--amb)"><h2>Simulação: {{ sim.titulo }}</h2><div style="margin-top:8px;line-height:1.6">{{ sim.texto }}</div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn acc" onClick="{{ sim.aplicar }}">Aplicar: {{ sim.acao }}</button><button class="btn" onClick="{{ closeSim }}">Fechar</button></div></div>
      </sc-if>

<script>
(function(){
  var TEMPLATE = document.getElementById('tpl').innerHTML;
  var handlers = [];
  function lookup(scope, path){
    var parts = path.trim().split('.');
    if (parts[0]==='true') return true; if (parts[0]==='false') return false;
    for (var i=scope.length-1;i>=0;i--){ var o = scope[i];
      if (o && Object.prototype.hasOwnProperty.call(o, parts[0])){ var v = o[parts[0]]; for (var j=1;j<parts.length && v!=null;j++) v = v[parts[j]]; return v; } }
    return undefined;
  }
  function findClose(s, tag, from){ var open='<'+tag, close='</'+tag+'>', depth=0, i=from;
    while (i < s.length){ var a=s.indexOf(open,i), b=s.indexOf(close,i); if (b<0) return -1;
      if (a>=0 && a<b){ depth++; i=a+open.length; } else { if (depth===0) return b; depth--; i=b+close.length; } }
    return -1; }
  function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function render(s, scope){ var out='', i=0;
    while (i < s.length){ var m=/<(sc-if|sc-for)\b([^>]*)>/.exec(s.slice(i)); if (!m){ out+=fill(s.slice(i),scope); break; }
      var start=i+m.index, tag=m[1], attrs=m[2]; out+=fill(s.slice(i,start),scope);
      var innerStart=start+m[0].length, end=findClose(s,tag,innerStart), inner=s.slice(innerStart,end);
      if (tag==='sc-if'){ var vm=/value="\{\{\s*([^}]+?)\s*\}\}"/.exec(attrs); if (vm && lookup(scope,vm[1])) out+=render(inner,scope); }
      else { var lm=/list="\{\{\s*([^}]+?)\s*\}\}"/.exec(attrs), am=/as="([^"]+)"/.exec(attrs); var list=(lm && lookup(scope,lm[1]))||[];
        for (var k=0;k<list.length;k++){ var sc={}; sc[am[1]]=list[k]; sc.$index=k; out+=render(inner,scope.concat([sc])); } }
      i=end+('</'+tag+'>').length; }
    return out; }
  function fill(s, scope){
    s = s.replace(/\s(onClick|onChange)="\{\{\s*([^}]+?)\s*\}\}"/g, function(_,ev,path){ var fn=lookup(scope,path); var id=handlers.push(fn)-1; return ' data-'+(ev==='onClick'?'click':'change')+'="'+id+'"'; });
    s = s.replace(/\svalue="\{\{\s*([^}]+?)\s*\}\}"/g, function(_,path){ return ' data-value="'+esc(lookup(scope,path))+'"'; });
    s = s.replace(/\shint-placeholder-(?:val|count)="[^"]*"/g, '');
    return s.replace(/\{\{\s*([^}]+?)\s*\}\}/g, function(_,path){ return esc(lookup(scope,path)); }); }
  var root=document.getElementById('app'), instance=null;
  function DCLogic(props){ this.props=props||{}; }
  DCLogic.prototype.setState=function(o){ Object.assign(this.state,o); mount(); };
  window.DCLogic=DCLogic;
  function mount(){ handlers=[]; var vals=instance.renderVals();
    var sy=window.scrollY; root.innerHTML=render(TEMPLATE,[vals]);
    root.querySelectorAll('[data-click]').forEach(function(el){ el.addEventListener('click', function(e){ var fn=handlers[+el.getAttribute('data-click')]; if (typeof fn==='function') fn(e); }); });
    root.querySelectorAll('[data-change]').forEach(function(el){ el.addEventListener('change', function(e){ var fn=handlers[+el.getAttribute('data-change')]; if (typeof fn==='function') fn(e); }); });
    root.querySelectorAll('[data-value]').forEach(function(el){ el.value=el.getAttribute('data-value'); });
    window.scrollTo(0,sy); }
  window.__boot=function(C){ instance=new C(); mount(); };
})();
</script>
