<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Operação — protótipo v3 (autônomo)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:#eef1f6;color:#141a2b}
a{color:#0b1f4b}a:hover{color:#c9622b}
button{font-family:inherit;cursor:pointer}
.tab{border:0;background:transparent;padding:14px 14px;font-size:14px;font-weight:600;color:#5b6478;border-bottom:3px solid transparent;display:flex;gap:8px;align-items:center;min-height:44px}
.tab.on{color:#0b1f4b;border-bottom-color:#c9622b}
.tab .n{background:#e6eaf2;color:#0b1f4b;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.tab.on .n{background:#c9622b;color:#fff}
.tab .n.warn{background:#fff1d6;color:#7a4a00}
.row{display:grid;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid #edf0f5;font-size:13px;min-height:44px}
.row:hover{background:#f7f9fc}.row.sel{background:#fff6f0}
.hd{display:grid;gap:10px;padding:8px 14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7a8296;font-weight:600}
.gF{grid-template-columns:26px 1.5fr 1.1fr 0.9fr 1fr 1fr 0.8fr 130px}
.gA{grid-template-columns:1.4fr 1fr 1.1fr 0.9fr 1fr 0.7fr 0.8fr 210px}
.gC{grid-template-columns:1.4fr 1fr 1.1fr 1fr 1fr 0.7fr 230px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-red{background:#fbe7e6;color:#8f1d17}.p-amb{background:#fff1d6;color:#7a4a00}.p-grn{background:#e1f3e8;color:#155e39}.p-blu{background:#e3ebfa;color:#1d3f8f}.p-gry{background:#eceff4;color:#4c5568}.p-ex{background:#f1e8fb;color:#5b2a8a;border:1px dashed #b98ee0}
.btn{border:1px solid #cfd6e3;background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:#0b1f4b;min-height:36px;white-space:nowrap}
.btn.pri{background:#0b1f4b;color:#fff;border-color:#0b1f4b}.btn.acc{background:#c9622b;color:#fff;border-color:#c9622b}.btn.sm{padding:4px 9px;min-height:30px;font-size:12px}
.card{background:#fff;border:1px solid #dfe4ee;border-radius:12px}
.kpi{background:#fff;border:1px solid #dfe4ee;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:3px;min-width:118px}
.kpi b{font-size:24px;line-height:1}.kpi span{font-size:11px;color:#5b6478;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.grp{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#f7f9fc;border-top:1px solid #dfe4ee;font-size:13px}
.side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;color:#c9d2e6;text-decoration:none;font-size:14px;font-weight:500}
.side a.on{background:#1d3466;color:#fff}
.chk{width:18px;height:18px;border:2px solid #9aa4b8;border-radius:4px;display:inline-block;box-sizing:border-box;background:#fff;padding:0}
.chk.on{background:#c9622b;border-color:#c9622b}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#5b6478;font-weight:600}
.field input,.field select,.field textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid #cfd6e3;border-radius:8px;min-height:38px;color:#141a2b;background:#fff;box-sizing:border-box;width:100%}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid #dfe4ee;border-radius:10px;font-size:13px}
.step.cur{border-color:#c9622b;background:#fff8f3}.step.done{background:#f3faf6;border-color:#cfe8d8}
.dtab{border:0;background:transparent;padding:8px 10px;font-size:13px;font-weight:600;color:#5b6478;border-bottom:2px solid transparent;min-height:36px}
.dtab.on{color:#0b1f4b;border-bottom-color:#0b1f4b}
.radar{padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;font-family:inherit;color:inherit;background:#fff;border:1px solid #dfe4ee;border-radius:12px;border-left-width:4px;min-height:44px}
.radar:hover{background:#f7f9fc}
.bar{height:8px;background:#eceff4;border-radius:4px;overflow:hidden}
.blk{padding:10px 14px;font-weight:700;font-size:13px;border-top:1px solid #dfe4ee;display:flex;gap:10px;align-items:center}
</style>

<style>html,body{background:#dfe4ee} #app{margin:16px auto;width:1440px;box-shadow:0 20px 60px rgba(11,31,75,.25)}</style>
</head>
<body>
<div id="app"></div>
<script type="text/template" id="tpl">

<div style="width: 1440px; height: 1080px; box-sizing: border-box; display: flex; background: #eef1f6; overflow: hidden; position: relative">

  <nav class="side" style="width: 200px; flex-shrink: 0; background: #0b1f4b; padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box">
    <div style="color: #fff; font-weight: 700; font-size: 16px; padding: 6px 12px 18px">Grupo Discovery</div>
    <a href="#">Página Inicial</a><a href="#">Processos</a><a href="#" class="on">Operação</a><a href="#">Calendário</a><a href="#">Árvore Genealógica</a><a href="#">Revisão Registral</a><a href="#">Relatórios</a>
    <div style="flex-grow: 1"></div>
  </nav>

  <main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; box-sizing: border-box">

    <header style="display: flex; align-items: center; gap: 14px; padding: 12px 24px 0; background: #fff; border-bottom: 1px solid #dfe4ee">
      <div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 12px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: #0b1f4b">Operação</h1>
        <div style="font-size: 13px; color: #5b6478">Sexta, 25 de setembro · Daniela Brait · equipe documental</div>
      </div>
      <div style="flex-grow: 1"></div>
      <div style="display: flex; gap: 8px; padding-bottom: 12px; align-items: center">
        <button class="kpi" onClick="{{ kFila }}" style="border-color: #c9622b; cursor: pointer; text-align: left; font-family: inherit"><b style="color: #c9622b">{{ nFila }}</b><span>Fila</span></button>
        <button class="kpi" onClick="{{ kAguard }}" style="cursor: pointer; text-align: left; font-family: inherit"><b>{{ nAguard }}</b><span>Aguardando</span></button>
        <button class="kpi" onClick="{{ kVenc }}" style="border-color: #b26a00; cursor: pointer; text-align: left; font-family: inherit"><b style="color: #7a4a00">{{ nAcompVenc }}</b><span>Acomp. vencidos</span></button>
        <button class="kpi" onClick="{{ kAtras }}" style="border-color: #b3261e; cursor: pointer; text-align: left; font-family: inherit"><b style="color: #8f1d17">{{ nAtras }}</b><span>Atrasadas</span></button>
        <button class="kpi" onClick="{{ kAbertas }}" style="cursor: pointer; text-align: left; font-family: inherit"><b>{{ nAbertas }}</b><span>Abertas</span></button>
        <button class="btn" onClick="{{ toggleNotif }}" aria-label="Notificações operacionais" style="min-width: 44px; position: relative">🔔 <span class="pill p-red" style="padding: 0 6px">{{ nNotif }}</span></button>
      </div>
    </header>
    <sc-if value="{{ notifOpen }}" hint-placeholder-val="{{ false }}">
      <div class="card" style="position: absolute; right: 24px; top: 70px; width: 400px; z-index: 20; box-shadow: 0 12px 32px rgba(11,31,75,.18)">
        <div style="padding: 10px 14px; font-weight: 700; border-bottom: 1px solid #edf0f5; display: flex; justify-content: space-between"><span>Notificações operacionais</span><button class="btn sm" onClick="{{ toggleNotif }}">✕</button></div><sc-if value="{{ noNotif }}" hint-placeholder-val="{{ false }}"><div style="padding: 14px; font-size: 13px; color: #5b6478">Nada pendente.</div></sc-if>
        <sc-for list="{{ notifs }}" as="n" hint-placeholder-count="3">
          <button onClick="{{ n.go }}" style="display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 14px; border-bottom: 1px solid #edf0f5; font-size: 13px; font-family: inherit; color: inherit; cursor: pointer"><span class="pill {{ n.cls }}">{{ n.tag }}</span> {{ n.txt }}</button>
        </sc-for>
      </div>
    </sc-if>

    <div style="display: flex; gap: 2px; padding: 0 24px; background: #fff; border-bottom: 1px solid #dfe4ee; align-items: center">
      <button class="tab {{ onFila }}" onClick="{{ goFila }}">Fila <span class="n">{{ nFila }}</span></button>
      <button class="tab {{ onAguard }}" onClick="{{ goAguard }}">Aguardando <span class="n">{{ nAguard }}</span></button>
      <button class="tab {{ onAcomp }}" onClick="{{ goAcomp }}">Acompanhamento <span class="n warn">{{ nAcompVenc }} vencidos</span></button>
      <button class="tab {{ onFam }}" onClick="{{ goFam }}">Famílias <span class="n">{{ nFam }}</span></button>
      <button class="tab {{ onRadar }}" onClick="{{ goRadar }}">Radar <span class="n">{{ nRadar }}</span></button>
      <button class="tab {{ onFeito }}" onClick="{{ goFeito }}">Feito <span class="n">{{ nFeito }}</span></button>
      <div style="flex-grow: 1"></div>
      <div style="display: flex; gap: 8px; align-items: center; padding: 8px 0">
        <label class="field" style="flex-direction: row; align-items: center; gap: 6px"><span>Vista</span><select aria-label="Vista salva" value="{{ vista }}" onChange="{{ setVista }}" style="width: auto"><option value="minha">Minha fila</option><option value="es">Só Espanha</option><option value="it">Só Itália</option><option value="urg">Só urgentes (vencidos + atrasadas)</option></select></label>
        <input aria-label="Buscar" placeholder="Buscar família, pessoa, documento, órgão…" value="{{ busca }}" onChange="{{ setBusca }}" style="font-family: inherit; font-size: 13px; padding: 8px 12px; border: 1px solid #cfd6e3; border-radius: 8px; width: 260px; min-height: 38px; box-sizing: border-box"><sc-if value="{{ hasBusca }}" hint-placeholder-val="{{ false }}"><button class="btn sm" onClick="{{ clearBusca }}">✕</button></sc-if>
      </div>
    </div>

    <div style="display: flex; flex-grow: 1; min-height: 0">
      <section style="flex-grow: 1; min-width: 0; padding: 18px 24px; overflow: auto; display: flex; flex-direction: column; gap: 14px">

        <!-- ===== FILA ===== -->
        <sc-if value="{{ tabFila }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
            <button class="btn acc" onClick="{{ startFocus }}">▶ Trabalhar a fila ({{ nFila }})</button>
            <label class="field" style="flex-direction: row; align-items: center; gap: 6px"><span>Por família, depois por</span>
              <select aria-label="Agrupar por" value="{{ group }}" onChange="{{ setGroup }}" style="width: auto"><option value="pessoa">Pessoa</option><option value="orgao">Órgão</option><option value="passo">Passo</option></select>
            </label>
            <sc-if value="{{ hasRadarFilter }}" hint-placeholder-val="{{ false }}"><span class="pill p-red">Radar: {{ radarLabel }} <button class="btn sm" onClick="{{ clearRadar }}" style="border: 0; background: transparent; color: #8f1d17; min-height: 22px; padding: 0 4px">✕</button></span></sc-if>
            <sc-if value="{{ hasQuick }}" hint-placeholder-val="{{ false }}"><span class="pill p-red">Filtro: {{ quickLabel }} <button class="btn sm" onClick="{{ clearQuick }}" style="border: 0; background: transparent; color: #8f1d17; min-height: 22px; padding: 0 4px">✕</button></span></sc-if>
            <button class="btn" onClick="{{ addTransversal }}">+ Tarefa transversal</button><button class="btn sm" onClick="{{ colAll }}">Recolher tudo</button><button class="btn sm" onClick="{{ expAll }}">Expandir tudo</button>
            <div style="flex-grow: 1"></div>
            <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; gap: 6px; align-items: center; background: #fff6f0; border: 1px solid #f0c9b3; border-radius: 10px; padding: 5px 8px">
                <span style="font-size: 13px; font-weight: 600; color: #8a3f15">{{ selCount }} sel.</span>
                <button class="btn acc sm" onClick="{{ iniciarSel }}">Iniciar (enviar ao cartório) as {{ selCount }}</button>
                <button class="btn sm" onClick="{{ note }}">Vincular órgão</button>
                <button class="btn sm" onClick="{{ note }}">Atribuir</button>
                <button class="btn sm" onClick="{{ clearSel }}">Limpar</button>
              </div>
            </sc-if>
          </div>
          <div style="font-size: 12px; color: #5b6478">Fila = o que depende de você agora: certidões <b>a iniciar</b> (enviar ao cartório) e no <b>passo 4</b> (conferir e validar). O que está com o cartório fica em Aguardando.</div>
          <sc-if value="{{ showBlock }}" hint-placeholder-val="{{ true }}">
            <div class="card" style="border-left: 4px solid #b3261e; padding: 10px 14px; display: flex; gap: 12px; align-items: center; font-size: 13px">
              <span class="pill p-red">Bloqueio</span><span><b>{{ nNoOrg }} certidões sem órgão emissor.</b> Não dá pra enviar sem destino — vincule antes de iniciar.</span>
              <div style="flex-grow: 1"></div><button class="btn pri" onClick="{{ vincularTodos }}">Vincular órgão nas {{ nNoOrg }}</button>
            </div>
          </sc-if>
          <sc-if value="{{ emptyFila }}" hint-placeholder-val="{{ false }}">
            <div class="card" style="padding: 40px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center"><b style="font-size: 16px; color: #155e39">{{ emptyFilaTitle }}</b><span style="color: #5b6478">{{ nAguard }} certidões com o cartório · {{ nAcompVenc }} acompanhamentos vencidos.</span></div>
          </sc-if>
          <sc-for list="{{ filaFams }}" as="F" hint-placeholder-count="2">
            <div class="card" style="border-left: 4px solid #0b1f4b; margin-top: 10px; padding-bottom: 12px; box-shadow: 0 2px 8px rgba(11,31,75,.06)">
              <div class="grp" style="border-top: 0; border-radius: 12px 12px 0 0; background: #e3e8f2; padding: 13px 16px">
                <button class="chk {{ F.chkCls }}" onClick="{{ F.toggleAll }}" aria-label="Selecionar família"></button>
                <button class="btn sm" onClick="{{ F.toggleCol }}" aria-label="Expandir ou recolher família" style="min-width: 32px">{{ F.caret }}</button>
                <span class="pill p-gry">Família</span><b style="font-size: 14px">{{ F.fam }}</b><span style="color:#5b6478">{{ F.pais }} · {{ F.n }} tarefa(s) na fila</span>
                <div style="flex-grow: 1"></div>
                <button class="btn sm" onClick="{{ F.openFam }}">Ver família</button>
              </div>
              <sc-if value="{{ F.open }}" hint-placeholder-val="{{ true }}">
              <sc-for list="{{ F.groups }}" as="g" hint-placeholder-count="3">
              <div style="margin: 12px 12px 0; border: 1px solid #dfe4ee; border-radius: 10px; overflow: hidden">
                <div class="grp" style="border-top: 0">
                  <button class="chk {{ g.chkCls }}" onClick="{{ g.toggleAll }}" aria-label="Selecionar grupo"></button>
                  <button class="btn sm" onClick="{{ g.toggleCol }}" aria-label="Expandir ou recolher" style="min-width: 32px">{{ g.caret }}</button>
                  <span class="pill {{ g.pillCls }}">{{ g.pill }}</span><b>{{ g.title }}</b><span style="color:#5b6478">{{ g.sub }}</span>
                  <div style="flex-grow: 1"></div>
                  <sc-if value="{{ g.lote }}" hint-placeholder-val="{{ true }}"><button class="btn sm" onClick="{{ g.toggleAll }}">Selecionar as {{ g.n }} (mesmo requerimento)</button></sc-if>
                </div>
                <sc-if value="{{ g.open }}" hint-placeholder-val="{{ true }}">
                <div class="hd gF"><span></span><span>Documento</span><span>Pessoa</span><span>Por que aqui</span><span>Passo atual</span><span>Acompanhamento</span><span>Órgão</span><span>Ação</span></div>
                <sc-for list="{{ g.rows }}" as="t" hint-placeholder-count="2">
                  <div class="row gF {{ t.selCls }}">
                    <button class="chk {{ t.chkCls }}" onClick="{{ t.toggle }}" aria-label="Selecionar"></button>
                    <div style="font-weight: 600">{{ t.doc }}<div style="font-size: 11px; color: #7a8296; font-weight: 500">{{ t.fam }} · {{ t.pais }}</div></div>
                    <div>{{ t.pessoa }}<div style="font-size: 11px; color: #7a8296">{{ t.ger }}</div></div>
                    <div><span class="pill {{ t.whyCls }}">{{ t.why }}</span></div>
                    <div>{{ t.passoLabel }}<div style="font-size: 11px; color: #7a8296">{{ t.passoSub }}</div></div>
                    <div><span class="pill {{ t.acompCls }}">{{ t.acompTxt }}</span><div style="font-size: 11px; color: #7a8296">{{ t.prazoTxt }}</div></div>
                    <div><span class="pill {{ t.orgCls }}">{{ t.org }}</span></div>
                    <div style="display: flex; gap: 4px"><button class="btn sm {{ t.btnCls }}" onClick="{{ t.open }}">{{ t.acao }}</button></div>
                  </div>
                </sc-for>
                </sc-if>
              </div>
              </sc-for>
              </sc-if>
            </div>
          </sc-for>
        </sc-if>

        <!-- ===== AGUARDANDO ===== -->
        <sc-if value="{{ tabAguard }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; gap: 10px; align-items: center"><div style="font-size: 15px; font-weight: 600; color: #0b1f4b">O que está com o cartório</div><span style="font-size: 12px; color: #5b6478">passos 2 (confirmar pedido) e 3 (receber certidão) — vencido ou não</span><label class="field" style="flex-direction: row; align-items: center; gap: 6px"><span>Agrupar por</span><select aria-label="Agrupar Aguardando" value="{{ aguardPor }}" onChange="{{ setAguardPor }}" style="width: auto"><option value="familia">Família</option><option value="orgao">Órgão (cobrar juntos)</option></select></label><sc-if value="{{ hasQuick }}" hint-placeholder-val="{{ false }}"><span class="pill p-red">Filtro: {{ quickLabel }} <button class="btn sm" onClick="{{ clearQuick }}" style="border: 0; background: transparent; color: #8f1d17; min-height: 22px; padding: 0 4px">✕</button></span></sc-if><div style="flex-grow: 1"></div></div>
          <sc-if value="{{ emptyAguard }}" hint-placeholder-val="{{ false }}"><div class="card" style="padding: 40px; text-align: center; color: #5b6478"><b style="color: #0b1f4b">{{ emptyAguardTitle }}</b><br>{{ emptyAguardSub }}</div></sc-if>
          <sc-if value="{{ hasAguard }}" hint-placeholder-val="{{ true }}">
            <sc-for list="{{ aguardGroups }}" as="g" hint-placeholder-count="2">
            <div class="card" style="border-left: 4px solid #0b1f4b; margin-top: 10px; padding-bottom: 12px; box-shadow: 0 2px 8px rgba(11,31,75,.06)">
              <div class="grp" style="border-top: 0; border-radius: 12px 12px 0 0; background: #e3e8f2; padding: 13px 16px"><button class="btn sm" onClick="{{ g.toggleCol }}" aria-label="Expandir ou recolher família" style="min-width: 32px">{{ g.caret }}</button><span class="pill p-gry">{{ g.pill }}</span><b style="font-size: 14px">{{ g.fam }}</b><span style="color:#5b6478">{{ g.pais }} · {{ g.n }} tarefa(s)</span><div style="flex-grow: 1"></div><sc-if value="{{ g.hasFam }}" hint-placeholder-val="{{ true }}"><button class="btn sm" onClick="{{ g.openFam }}">Ver família</button></sc-if></div>
              <sc-if value="{{ g.open }}" hint-placeholder-val="{{ true }}">
              <div style="margin: 12px 12px 0; border: 1px solid #dfe4ee; border-radius: 10px; overflow: hidden">
              <div class="hd gA"><span>Documento</span><span>Com quem</span><span>Passo atual</span><span>Desde</span><span>Acompanhamento</span><span>Cobranças</span><span>Prazo da tarefa</span><span>Ação</span></div>
            <sc-for list="{{ g.rows }}" as="t" hint-placeholder-count="2">
              <div class="row gA" style="box-shadow: inset 4px 0 0 {{ t.rowMark }}">
                <div style="font-weight: 600">{{ t.doc }}<div style="font-size: 11px; color: #7a8296; font-weight: 500">{{ t.fam }} · {{ t.pessoa }}</div></div>
                <div>{{ t.org }}</div>
                <div>{{ t.passoLabel }}<div style="font-size: 11px; color: #7a8296">{{ t.passoSub }}</div></div>
                <div>{{ t.desde }}</div>
                <div><span class="pill {{ t.acompCls }}">{{ t.acompTxt }}</span></div>
                <div>{{ t.cobTxt }}</div>
                <div><span class="pill {{ t.prazoCls }}">{{ t.prazoTxt }}</span></div>
                <div style="display: flex; gap: 4px; flex-wrap: wrap"><sc-if value="{{ t.acompVenc }}" hint-placeholder-val="{{ false }}"><button class="btn sm acc" onClick="{{ t.cobrar }}">Cobrar</button></sc-if><button class="btn sm" onClick="{{ t.concluir }}">{{ t.concluirLabel }}</button><button class="btn sm" onClick="{{ t.open }}">Abrir</button></div>
              </div>
            </sc-for>
              </div>
            </sc-if>
            </div>
            </sc-for>
          </sc-if>
        </sc-if>

        <!-- ===== ACOMPANHAMENTO ===== -->
        <sc-if value="{{ tabAcomp }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; gap: 10px; align-items: center"><div style="font-size: 15px; font-weight: 600; color: #0b1f4b">O que precisa de controle</div><span style="font-size: 12px; color: #5b6478">só acompanhamentos vencidos, de hoje, de amanhã e dos próximos 7 dias — de qualquer passo, esteja na Fila ou em Aguardando</span><div style="flex-grow: 1"></div><button class="btn sm" onClick="{{ toggleDepois }}">{{ depoisLabel }}</button><button class="btn" onClick="{{ cobrarVencidos }}">Cobrar todos os vencidos de terceiro</button></div>
          <div style="display: flex; gap: 10px">
            <div class="kpi" style="border-color: #b3261e"><b style="color: #8f1d17">{{ cVenc }}</b><span>Vencidos</span></div>
            <div class="kpi" style="border-color: #c9622b"><b style="color: #c9622b">{{ cHoje }}</b><span>Hoje</span></div>
            <div class="kpi"><b>{{ cAmanha }}</b><span>Amanhã</span></div>
            <div class="kpi"><b>{{ cSemana }}</b><span>Próximos 7 dias</span></div>
          </div>
          <sc-if value="{{ emptyAcomp }}" hint-placeholder-val="{{ false }}"><div class="card" style="padding: 40px; text-align: center; color: #5b6478"><b style="color: #155e39">Tudo em dia.</b><br>Próximo acompanhamento: {{ proxAcomp }}</div></sc-if>

<script>
(function(){
  // --- tiny runtime that mirrors the DC template semantics (holes, sc-if, sc-for, onClick/onChange) ---

      var o = scope[i];
      if (o && Object.prototype.hasOwnProperty.call(o, parts[0])){
        var v = o[parts[0]];

      }
    }

  }

    var open = '<'+tag, close = '</'+tag+'>', depth = 0, i = from;

      var a = s.indexOf(open, i), b = s.indexOf(close, i);
      if (b < 0) return -1;
      if (a >= 0 && a < b){ depth++; i = a + open.length; }

    }
    return -1;
  }

      var m = /<(sc-if|sc-for)\b([^>]*)>/.exec(s.slice(i));
      if (!m){ out += fill(s.slice(i), scope); break; }

      var innerStart = start + m[0].length;
      var end = findClose(s, tag, innerStart);
      var inner = s.slice(innerStart, end);
      if (tag==='sc-if'){
        var vm = /value="\{\{\s*([^}]+?)\s*\}\}"/.exec(attrs);
        if (vm && lookup(scope, vm[1])) out += render(inner, scope);
      } else {
        var lm = /list="\{\{\s*([^}]+?)\s*\}\}"/.exec(attrs), am = /as="([^"]+)"/.exec(attrs);
        var list = (lm && lookup(scope, lm[1])) || [];
        for (var k=0;k<list.length;k++){ var sc = {}; sc[am[1]] = list[k]; sc.$index = k; out += render(inner, scope.concat([sc])); }
      }

    }

  }

    // event attributes
    s = s.replace(/\s(onClick|onChange)="\{\{\s*([^}]+?)\s*\}\}"/g, function(_, ev, path){

  }

  var instance = null, vals = null;
  function DCLogic(props){ this.props = props||{}; }
  DCLogic.prototype.setState = function(o){ Object.assign(this.state, o); mount(); };
  window.DCLogic = DCLogic;
  function mount(){
    handlers = [];
    vals = instance.renderVals();
    var scrollers = Array.prototype.map.call(root.querySelectorAll('section, aside'), function(el){ return el.scrollTop; });
    root.innerHTML = render(TEMPLATE, [vals]);
    root.querySelectorAll('[data-click]').forEach(function(el){ el.addEventListener('click', function(e){ var fn = handlers[+el.getAttribute('data-click')]; if (typeof fn==='function') fn(e); }); });
    root.querySelectorAll('[data-change]').forEach(function(el){ el.addEventListener('change', function(e){ var fn = handlers[+el.getAttribute('data-change')]; if (typeof fn==='function') fn(e); }); });
    root.querySelectorAll('[data-value]').forEach(function(el){ el.value = el.getAttribute('data-value'); });
    Array.prototype.forEach.call(root.querySelectorAll('section, aside'), function(el, i){ if (scrollers[i]) el.scrollTop = scrollers[i]; });
  }

})();
</script>
